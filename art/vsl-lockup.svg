<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" fill="none">
  <defs>
    <linearGradient id="lockup-bg" x1="0" y1="0" x2="920" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060B16"/>
    </linearGradient>
    <radialGradient id="lockup-glow" cx="190" cy="70" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#060B16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lockup-glow-r" cx="820" cy="210" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#060B16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lockup-rim" x1="0" y1="0" x2="920" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="lockup-text" x1="282" y1="60" x2="460" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="lockup-sub" x1="288" y1="186" x2="620" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    
    <linearGradient id="vsl-lockup-portal" x1="80" y1="420" x2="360" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="vsl-lockup-trunk" x1="180" y1="346" x2="180" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="vsl-lockup-branch" x1="180" y1="346" x2="360" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="vsl-lockup-beacon" x1="320" y1="176" x2="440" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <mask id="vsl-lockup-root-mask">
      <rect x="0" y="0" width="512" height="512" fill="white"/>
      <circle cx="180.00" cy="346.00" r="11.00" fill="black"/>
    </mask>
    
  </defs>
  <rect width="920" height="260" rx="28" fill="url(#lockup-bg)"/>
  <rect width="920" height="260" rx="28" fill="url(#lockup-glow)"/>
  <rect width="920" height="260" rx="28" fill="url(#lockup-glow-r)"/>
  <rect x="1.5" y="1.5" width="917" height="257" rx="26.5" stroke="url(#lockup-rim)" stroke-width="3"/>
  <g transform="translate(36 22) scale(0.422)">
    
    <g id="vsl-lockup-emblem">
      <!-- Outer Worktree Sandbox Portal -->
      <path d="M 360.00 276.00 L 360.00 366.00 A 54.00 54.00 0 0 1 306.00 420.00 L 142.00 420.00 A 54.00 54.00 0 0 1 88.00 366.00 L 88.00 202.00 A 54.00 54.00 0 0 1 142.00 148.00 L 232.00 148.00"
            fill="none"
            stroke="url(#vsl-lockup-portal)"
            stroke-width="48.0"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <!-- Parallel Worktree Stem (Trunk + Isolated Node) -->
      <g mask="url(#vsl-lockup-root-mask)">
        <line x1="180.00" y1="346.00"
              x2="180.00" y2="220.00"
              stroke="url(#vsl-lockup-trunk)"
              stroke-width="34.0"
              stroke-linecap="round"/>
        <circle cx="180.00" cy="220.00" r="23.0"
                fill="url(#vsl-lockup-trunk)"/>

        <!-- Live Preview Branch Launching Through Portal -->
        <path d="M 180.00 346.00 A 72.00 72.00 0 0 1 201.09 295.09 L 360.00 136.18"
              fill="none"
              stroke="url(#vsl-lockup-branch)"
              stroke-width="34.0"
              stroke-linecap="round"
              stroke-linejoin="round"/>

        <!-- Root Node Ring -->
        <circle cx="180.00" cy="346.00" r="30.0"
                fill="url(#vsl-lockup-branch)"/>
      </g>

      <!-- Live HTTPS Beacon Node -->
      <circle cx="360.00" cy="136.18" r="32.0"
              fill="url(#vsl-lockup-beacon)"/>
      <circle cx="360.00" cy="136.18" r="11.0"
              fill="#FFFFFF"/>

      <!-- Live Broadcast Signal Arcs -->
      <path d="M 373.31 73.58 A 64.00 64.00 0 0 1 422.60 122.87"
            fill="none"
            stroke="url(#vsl-lockup-beacon)"
            stroke-width="19.0"
            stroke-linecap="round"/>
      <path d="M 388.43 48.68 A 92.00 92.00 0 0 1 447.50 107.75"
            fill="none"
            stroke="url(#vsl-lockup-beacon)"
            stroke-width="15.0"
            stroke-linecap="round"
            opacity="0.58"/>
    </g>
    
  </g>
  <text x="282" y="144"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="112" font-weight="800" letter-spacing="-3" fill="url(#lockup-text)">vsl</text>
  <text x="288" y="186"
        font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" font-weight="700" letter-spacing="5.5" fill="url(#lockup-sub)">WORKTREE PREVIEW</text>
  <text x="288" y="218"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="500" letter-spacing="0.4" fill="#94A3B8">Instant HTTPS previews · Octane + Bun Vite HMR + Isolated DBs</text>
</svg>
